; Add these settings to the PHP-FPM pool serving Webpantau, then restart PHP-FPM.
; A dedicated pool is recommended when the VPS hosts multiple applications.
env[DATA_DIR] = /var/www/webpantau/data
env[TZ] = Asia/Makassar
; Enable only after HTTPS is configured (HTTP requests cannot use Secure cookies).
env[COOKIE_SECURE] = true
; Optional: restrict first-account creation. Set a private random value on the VPS.
; env[SETUP_KEY] = <enter a private value on the server>

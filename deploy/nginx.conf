# Replace pantau.example.com, checkout root, and PHP-FPM socket for your VPS.
# This HTTP configuration is for initial setup; enable HTTPS before public use.
server {
    listen 80;
    server_name pantau.example.com;
    root /var/www/webpantau/public;
    index index.php;
    client_max_body_size 32k;

    # Only backup validation accepts a file-sized JSON request.
    location = /api/backup/validate {
        client_max_body_size 5m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /api/ {
        rewrite ^ /api.php last;
    }

    location = /api.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The private app/, bin/ and data/ directories are outside the document root.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
